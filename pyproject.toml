[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.0",
    "ollama>=0.6.0",
    "pymupdf>=2.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[project.scripts]
ai-summit = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
